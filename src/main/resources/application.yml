spring:
  application:
    name: opspilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${DB_USER:opspilot}
    password: ${DB_PASSWORD:opspilot}
  jpa:
    hibernate:
      ddl-auto: update        # fine for a demo; use Flyway migrations in production
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

opspilot:
  agent:
    # Any Gemini model your API key can use. The API key itself is read from GOOGLE_API_KEY.
    model: ${OPSPILOT_MODEL:gemini-3.5-flash-lite}

logging:
  level:
    com.divakar.opspilot: INFO
