name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests use H2 and a mocked AI engine, so no secrets or database are needed here.
      - name: Build and test
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t opspilot:${{ github.sha }} .
