services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 5s
      retries: 10

  # Start with:  docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/opspilot
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPSPILOT_MODEL: ${OPSPILOT_MODEL:-gemini-2.5-flash}
    ports:
      - "8080:8080"

volumes:
  pgdata:
